name: PR preview deploy

on:
  workflow_run:
    workflows: [PR preview build]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v0.42.0
    with:
      package: sealed-lists
      local-image: sealed-lists
      application-prefix: sealed-lists
      port: 3000
      environment: |
        APP_URL={{PREVIEW_URL}}
        CENTRIFUGO_API_KEY={{RANDOM_HEX_32}}
        CENTRIFUGO_PROXY_SECRET={{RANDOM_HEX_32}}
      marker: <!-- sealed-lists-preview -->
      note: Preview traffic uses HTTP and data resets on every deployment. Create a disposable account with a unique password; never enter real lists or credentials.
    secrets: inherit
