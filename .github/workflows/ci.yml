name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v0.41.1
    with:
      command: just check
      just-version: '1.58.0'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, image]
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.41.1
    secrets: inherit

  production-image:
    if: needs.release.outputs.created == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Build and publish production image
        id: image
        uses: richardsolomou/ras-stack/actions/publish-production-image@v0.41.1
        with:
          image: ghcr.io/${{ github.repository }}
          sha: ${{ needs.release.outputs.sha }}
          release-tag: ${{ needs.release.outputs.tag }}
          token: ${{ github.token }}
          build-args: |
            VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      - name: Deploy production image
        if: vars.DOKPLOY_IMAGE_DEPLOY == 'true'
        uses: richardsolomou/ras-stack/actions/deploy-dokploy-image@v0.41.1
        with:
          url: ${{ secrets.DOKPLOY_URL }}
          api-key: ${{ secrets.DOKPLOY_API_KEY }}
          application-id: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          image: ${{ steps.image.outputs.reference }}
