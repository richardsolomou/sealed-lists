name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v0.30.0
    with:
      command: just check
      just-version: '1.58.0'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, image]
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.30.0
    secrets: inherit
