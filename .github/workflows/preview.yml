name: PR preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@v0.44.0
    with:
      package: sealed-lists
      local-image: sealed-lists
      domain: ras.sh
      subdomain-prefix: sealed-lists-pr
      marker: <!-- sealed-lists-preview -->
      note: Preview traffic uses HTTPS through Cloudflare and data resets on every deployment. Create a disposable account with a unique password; never enter real lists or credentials.
      cache-scope: sealed-lists-preview
